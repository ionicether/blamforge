<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blamforge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1319; --panel:#161d26; --panel-2:#1b2430;
  --line:#24303f; --line-soft:#1d2733;
  --text:#c8d3de; --bright:#eaf1f7; --dim:#6d7f92;
  --accent:#ff8a3d; --accent-dim:#7a4520;
  --ok:#46d39a; --bad:#e5544b;
  --display:"Chakra Petch",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

.masthead{border-bottom:1px solid var(--line);padding:22px 30px 18px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--bright);margin:0}
.wordmark span{color:var(--accent)}
.gamepath{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:10px;max-width:52vw}
.gamepath span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}

.shell{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);min-height:calc(100vh - 72px)}
.rail{border-right:1px solid var(--line);padding:22px 18px 40px}
.stage{padding:24px 30px 60px;min-width:0}
@media(max-width:860px){.shell{grid-template-columns:1fr}.rail{border-right:none;border-bottom:1px solid var(--line)}.stage{padding:20px}.gamepath{max-width:100%}}

.rail h2{font-family:var(--display);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:0 0 10px}
.pick{display:block;width:100%;text-align:left;border:1px solid transparent;border-left:2px solid var(--line);background:transparent;color:var(--text);padding:8px 11px;margin-bottom:2px;cursor:pointer;font-family:var(--body);font-size:14px}
.pick:hover{background:var(--panel);border-left-color:var(--dim)}
.pick.active{background:var(--panel-2);border-left-color:var(--accent);color:var(--bright)}
.pick .tick{color:var(--ok);font-family:var(--mono);font-size:11px;float:right}
.pick:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.target-head{display:flex;align-items:flex-start;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.target-head h2{font-family:var(--display);font-size:21px;letter-spacing:.03em;color:var(--bright);margin:0;font-weight:600}
.target-head p{margin:2px 0 0;color:var(--dim);font-size:13.5px}
.head-actions{margin-left:auto;display:flex;gap:9px;align-items:center}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--dim);border-radius:2px;margin-top:4px}
.badge.confirmed{color:var(--ok);border-color:#1f5a44}
.badge.derived{color:var(--accent);border-color:var(--accent-dim)}

.fields{margin-top:6px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:6px 24px;padding:15px 0;border-bottom:1px solid var(--line-soft);align-items:start}
.field.fixed{opacity:.55}
.field-label{font-weight:500;color:var(--bright);font-size:14.5px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.field-off{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.field-help{color:var(--dim);font-size:12.5px;margin-top:2px;max-width:58ch}
.field-control{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;gap:7px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;background:transparent}
.numwrap{display:flex;align-items:center;gap:6px}
input[type=number],input[type=text]{width:100%;background:#0a0e13;border:1px solid var(--line);color:var(--bright);font-family:var(--mono);font-size:13px;padding:5px 7px;border-radius:2px}
input:focus{outline:none;border-color:var(--accent)}
.unit{font-family:var(--mono);font-size:12px;color:var(--dim)}
.fixed-val{font-family:var(--mono);font-size:13px;color:var(--dim);padding:5px 0}
.stockmark{font-family:var(--mono);font-size:11px;color:var(--dim)}
.stockmark b{color:var(--accent);font-weight:500}

button{font-family:var(--display);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;border-radius:2px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border:1px solid var(--accent);color:#12181f;padding:9px 18px}
.btn-primary:hover{background:#ff9d5c}
.btn-primary:disabled{background:transparent;border-color:var(--line);color:var(--dim);cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);padding:8px 14px}
.btn-ghost:hover{border-color:var(--accent);color:var(--bright)}
.btn-danger{background:transparent;border:1px solid #5c2a26;color:var(--bad);padding:8px 14px}
.btn-danger:hover{border-color:var(--bad)}

.card{border:1px solid var(--line);background:var(--panel);padding:16px 18px;margin-top:18px;font-size:14px}
.card.good{border-left:2px solid var(--ok)}
.card.warn{border-left:2px solid var(--bad);border-color:#5c2a26}
.card h3{font-family:var(--display);font-size:13px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 7px}
.card.good h3{color:var(--ok)} .card.warn h3{color:var(--bad)}
.card p{margin:0;color:var(--dim);font-size:13.5px}
.card code{font-family:var(--mono);font-size:12px;color:var(--bright)}

.setup{max-width:560px;margin:40px auto;text-align:center}
.setup h2{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--bright);margin:0 0 10px}
.setup p{color:var(--dim);font-size:14px;margin:0 0 20px}
.setup .row{display:flex;gap:9px;margin-bottom:14px}
.track{height:3px;background:var(--line-soft);margin-top:14px;overflow:hidden}
.track i{display:block;height:100%;width:35%;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
@media(prefers-reduced-motion:reduce){.track i{animation:none;width:100%}}
</style>
</head>
<body>

<header class="masthead">
  <h1 class="wordmark">Blam<span>forge</span></h1>
  <div class="gamepath" id="gamepath"></div>
</header>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="stage" id="stage"></main>
</div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
let S = null, cur = null, vals = {}, stock = {};

const api = async (path, body) => {
  const r = await fetch(path, body ? {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)
  } : {});
  return r.json();
};

const trim = v => Number.isInteger(v) ? v : parseFloat(v.toFixed(6));

async function boot(){
  S = await api("/api/state");
  document.title = "Blamforge";
  drawPath();
  if (!S.game || !S.ready) return drawSetup();
  drawRail();
  if (cur) pick(cur); else drawIdle();
}

function drawPath(){
  $("#gamepath").innerHTML = S.game
    ? "<span>" + S.game + "</span>"
    : "";
}

function drawSetup(){
  $("#rail").innerHTML = "";
  const s = $("#stage");
  if (!S.retoc){
    s.innerHTML = '<div class="setup"><h2>Can\'t find retoc</h2>' +
      "<p>It's what actually reads and writes the game's containers, so " +
      'nothing works without it. Grab it from ' +
      '<code>github.com/trumank/retoc</code>, put it somewhere on your PATH, ' +
      'then start Blamforge again.</p></div>';
    return;
  }
  if (!S.game){
    s.innerHTML =
      '<div class="setup"><h2>Where\'s the game?</h2>' +
      "<p>Couldn't find it in the usual Steam spots. Paste the folder with " +
      "<code>Meteorite/Content/Paks</code> in it.</p>" +
      '<div class="row"><input type="text" id="gp" ' +
      'placeholder="/home/you/.local/share/Steam/steamapps/common/Halo Campaign Evolved">' +
      '<button class="btn-primary" id="gset">Set</button></div>' +
      '<div id="gerr"></div></div>';
    $("#gset").onclick = async () => {
      const r = await api("/api/game", {path: $("#gp").value.trim()});
      if (r.error){
        $("#gerr").innerHTML = '<div class="card warn"><p>' + r.error + "</p></div>";
      } else boot();
    };
    $("#gp").onkeydown = e => { if (e.key === "Enter") $("#gset").click(); };
    return;
  }
  s.innerHTML =
    '<div class="setup"><h2>One-time setup</h2>' +
    "<p>Blamforge needs to read the tags out of the game. It unpacks the " +
    "container once, keeps the dozen or so tags it can edit, and deletes the " +
    "rest. Your install isn't modified.</p>" +
    '<button class="btn-primary" id="go">Read the game files</button>' +
    '<div id="prog"></div></div>';
  $("#go").onclick = async () => {
    $("#go").disabled = true;
    await api("/api/extract", {});
    poll();
  };
}

async function poll(){
  const st = await api("/api/state");
  const p = $("#prog");
  if (p){
    p.innerHTML = '<div class="card"><p>' + (st.status || "Working…") +
      '</p><div class="track"><i></i></div></div>';
  }
  if (st.busy) return setTimeout(poll, 600);
  if (st.ready) return boot();
  if (p) p.innerHTML = '<div class="card warn"><h3>Didn\'t work</h3><p>' +
    (st.status || "Unknown error") + "</p></div>";
}

function drawRail(){
  const r = $("#rail");
  r.innerHTML = "<h2>Tags</h2>";
  S.registry.targets.forEach(t => {
    const b = document.createElement("button");
    b.className = "pick" + (cur === t.id ? " active" : "");
    b.innerHTML = t.name +
      (S.installed.includes(t.id) ? '<span class="tick">on</span>' : "");
    b.onclick = () => pick(t.id);
    r.appendChild(b);
  });
  const refresh = document.createElement("button");
  refresh.className = "btn-ghost";
  refresh.style.cssText = "width:100%;margin-top:16px";
  refresh.textContent = "Re-read game files";
  refresh.onclick = async () => {
    if (!confirm("Read everything out of the game again? Takes a minute.")) return;
    await api("/api/extract", {});
    drawSetup(); poll();
  };
  r.appendChild(refresh);
}

function drawIdle(){
  $("#stage").innerHTML =
    '<div class="setup"><h2>Pick something on the left</h2>' +
    "<p>Everything starts where the game has it. Move a slider and it'll " +
    "tell you what the value used to be.</p></div>";
}

async function pick(id){
  cur = id;
  drawRail();
  const t = S.registry.targets.find(x => x.id === id);
  const r = await api("/api/values?target=" + encodeURIComponent(id));
  if (r.error){
    $("#stage").innerHTML = '<div class="card warn"><h3>Can\'t read that tag</h3><p>' +
      r.error + "</p></div>";
    return;
  }
  if (r.mismatch && r.mismatch.length){
    $("#stage").innerHTML = '<div class="card warn"><h3>Not a stock tag</h3><p>' +
      r.mismatch.map(m => "<code>" + m.key + "</code> reads " + trim(m.got) +
        ", expected " + m.want).join("<br>") +
      "</p><p style='margin-top:9px'>A mod may already be installed, or the " +
      "game has updated since these offsets were mapped.</p></div>";
    return;
  }
  stock = {}; vals = {};
  t.fields.forEach(f => { stock[f.key] = f.stock; vals[f.key] = r.values[f.key]; });
  draw(t);
}

function links(t){
  (t.linked || []).forEach(l => {
    let v = vals[l.source];
    if (l.minus != null) v -= vals[l.minus];
    vals[l.target] = Math.max(0, Math.round(v));
  });
}

function draw(t){
  const s = $("#stage");
  s.innerHTML = "";

  const head = document.createElement("div");
  head.className = "target-head";
  head.innerHTML = "<div><h2>" + t.name + "</h2><p>" + t.subtitle + "</p></div>" +
    '<span class="badge ' + t.status + '">' +
    (t.status === "confirmed" ? "tested in game" : "not yet tested") + "</span>";
  const act = document.createElement("div");
  act.className = "head-actions";

  if (S.installed.includes(t.id)){
    const rm = document.createElement("button");
    rm.className = "btn-danger";
    rm.textContent = "Remove";
    rm.onclick = async () => {
      await api("/api/uninstall", {target: t.id});
      S = await api("/api/state");
      drawRail(); pick(t.id);
    };
    act.appendChild(rm);
  }
  const reset = document.createElement("button");
  reset.className = "btn-ghost";
  reset.textContent = "Reset";
  reset.onclick = () => { t.fields.forEach(f => vals[f.key] = f.stock); draw(t); };
  const go = document.createElement("button");
  go.className = "btn-primary";
  go.textContent = "Install";
  go.onclick = () => doInstall(t, go);
  act.append(reset, go);
  head.appendChild(act);
  s.appendChild(head);

  const list = document.createElement("div");
  list.className = "fields";

  t.fields.forEach(f => {
    const row = document.createElement("div");
    row.className = "field" + (f.derived ? " fixed" : "");

    const lab = document.createElement("div");
    lab.className = "field-label";
    lab.innerHTML = f.label +
      '<span class="field-off">0x' + f.off.toString(16).toUpperCase() + "</span>";
    row.appendChild(lab);

    if (f.help){
      const h = document.createElement("div");
      h.className = "field-help";
      h.textContent = f.help;
      row.appendChild(h);
    }

    const ctl = document.createElement("div");
    ctl.className = "field-control";

    if (f.derived){
      const d = document.createElement("div");
      d.className = "fixed-val";
      d.id = "v-" + f.key;
      d.textContent = vals[f.key];
      ctl.appendChild(d);
    } else {
      const range = document.createElement("input");
      range.type = "range";
      range.min = f.min; range.max = f.max; range.step = f.step;
      range.value = vals[f.key];
      range.setAttribute("aria-label", f.label);

      const nw = document.createElement("div");
      nw.className = "numwrap";
      const num = document.createElement("input");
      num.type = "number";
      num.min = f.min; num.max = f.max; num.step = f.step;
      num.value = trim(vals[f.key]);
      num.setAttribute("aria-label", f.label + " value");
      nw.appendChild(num);
      if (f.unit){
        const u = document.createElement("span");
        u.className = "unit"; u.textContent = f.unit;
        nw.appendChild(u);
      }

      const mark = document.createElement("div");
      mark.className = "stockmark";
      mark.id = "m-" + f.key;

      const paint = () => {
        const same = Math.abs(vals[f.key] - f.stock) < 1e-9;
        mark.innerHTML = same ? "as the game has it"
          : "was <b>" + trim(f.stock) + "</b>";
      };
      const commit = v => {
        v = Math.min(f.max, Math.max(f.min, parseFloat(v)));
        if (isNaN(v)) return;
        vals[f.key] = v;
        range.value = v; num.value = trim(v);
        links(t);
        t.fields.forEach(g => {
          if (g.derived){
            const e = document.getElementById("v-" + g.key);
            if (e) e.textContent = vals[g.key];
          }
        });
        paint();
      };
      range.oninput = e => commit(e.target.value);
      num.oninput = e => commit(e.target.value);
      paint();

      ctl.append(range, nw, mark);
    }
    row.appendChild(ctl);
    list.appendChild(row);
  });
  s.appendChild(list);
}

async function doInstall(t, btn){
  btn.disabled = true; btn.textContent = "Installing…";
  const r = await api("/api/install", {target: t.id, values: vals});
  btn.disabled = false; btn.textContent = "Install";

  const old = document.querySelector(".card"); if (old) old.remove();
  const c = document.createElement("div");
  if (r.error){
    c.className = "card warn";
    c.innerHTML = "<h3>Didn't install</h3><p>" + r.error + "</p>";
  } else {
    c.className = "card good";
    c.innerHTML = "<h3>Done</h3><p>Launch the game and it's live. Remove puts " +
      "everything back.</p>";
    S = await api("/api/state");
    drawRail();
  }
  $("#stage").appendChild(c);
}

boot();
})();
</script>
</body>
</html>
